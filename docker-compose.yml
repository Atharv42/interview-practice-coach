services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-coach-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      - WHISPER_MODEL_SIZE=tiny
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - PRACTICE_COACH_DB_PATH=/app/data/practice_coach.db
      - HF_HOME=/app/models_cache
    volumes:
      - coach-db-data:/app/data
      - coach-model-cache:/app/models_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    container_name: interview-coach-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  coach-db-data:
    name: interview_coach_db_data
  coach-model-cache:
    name: interview_coach_model_cache
